<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
    <title>TaSTT</title>
    <link rel="stylesheet" href="output.css">
</head>
<body>
    <div class="container-fluid px-6 py-6 h-screen flex flex-col">
        <div class="flex flex-1 gap-6 overflow-hidden">
            <!-- Left Panel: Configuration Form -->
            <div class="w-[28rem] flex-none relative flex flex-col overflow-hidden">
                <!-- Loading Overlay -->
                <div id="loading-overlay" class="absolute inset-0 bg-black bg-opacity-75 z-50 hidden flex items-center justify-center">
                    <div class="text-center p-6">
                        <div class="metro-spinner animate-spin"></div>
                        <p class="text-white"></p>
                    </div>
                </div>

                <header class="metro-header">
                    <h1 class="metro-logo">TaSTT</h1>
                    <p class="metro-tagline">speech to text</p>
                </header>

                <!-- Scrollable form container -->
                <div class="overflow-y-auto flex-1">
                    <form id="config-form" class="space-y-6 pr-3">
                        <!-- Basic settings (Always Visible) -->
                        <section class="config-section">
                            <h2 class="section-title"><i class="icon">&#xE9E9;</i>Model &amp; Language</h2>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label for="model" class="form-label">Model</label>
                                    <select id="model" class="form-input">
                                        <option value="tiny">tiny</option>
                                        <option value="base">base</option>
                                        <option value="small">small</option>
                                        <option value="medium">medium</option>
                                        <option value="distil-large-v3.5">distilled large 3.5</option>
                                        <option value="large">large</option>
                                    </select>
                                </div>
                                <div>
                                    <label for="language" class="form-label">Language</label>
                                    <select id="language" class="form-input">
                                        <option value="english">English</option>
                                        <option value="spanish">Spanish</option>
                                        <option value="french">French</option>
                                        <option value="german">German</option>
                                        <option value="italian">Italian</option>
                                        <option value="portuguese">Portuguese</option>
                                        <option value="russian">Russian</option>
                                        <option value="chinese">Chinese</option>
                                        <option value="japanese">Japanese</option>
                                        <option value="korean">Korean</option>
                                    </select>
                                </div>

                                    <label for="language_target" class="form-label">Translate to</label>

                                        <option value="bak_Cyrl">Bashkir</option>
                                        <option value="eus_Latn">Basque</option>
                                        <option value="bel_Cyrl">Belarusian</option>
                                        <option value="bem_Latn">Bemba</option>

                                        <option value="lit_Latn">Lithuanian</option>
                                        <option value="lmo_Latn">Lombard</option>
                                        <option value="lua_Latn">Luba - Kasai</option>
                                        <option value="luo_Latn">Luo</option>
                                        <option value="ltz_Latn">Luxembourgish</option>
                                        <option value="mkd_Cyrl">Macedonian</option>
                                        <option value="mag_Deva">Magahi</option>
                                        <option value="mai_Deva">Maithili</option>
                                        <option value="mal_Mlym">Malayalam</option>
                                        <option value="mlt_Latn">Maltese</option>
                                        <option value="mri_Latn">Maori</option>
                                        <option value="mar_Deva">Marathi</option>
                                        <option value="mni_Beng">Meitei(Bengali script)</option>
                                        <option value="acm_Arab">Mesopotamian Arabic</option>
                                        <option value="min_Arab">Minangkabau(Arabic script)</option>
                                        <option value="min_Latn">Minangkabau(Latin script)</option>
                                        <option value="lus_Latn">Mizo</option>
                                        <option value="arb_Arab">Modern Standard Arabic</option>
                                        <option value="arb_Latn">Modern Standard Arabic(Romanized)</option>
                                        <option value="ary_Arab">Moroccan Arabic</option>
                                        <option value="mos_Latn">Mossi</option>
                                        <option value="ars_Arab">Najdi Arabic</option>
                                        <option value="npi_Deva">Nepali</option>
                                        <option value="fuv_Latn">Nigerian Fulfulde</option>
                                        <option value="azj_Latn">North Azerbaijani</option>
                                        <option value="apc_Arab">North Levantine Arabic</option>
                                        <option value="kmr_Latn">Northern Kurdish</option>
                                        <option value="nso_Latn">Northern Sotho</option>
                                        <option value="uzn_Latn">Northern Uzbek</option>
                                        <option value="nob_Latn">Norwegian Bokmål</option>
                                        <option value="nno_Latn">Norwegian Nynorsk</option>
                                        <option value="nus_Latn">Nuer</option>
                                        <option value="nya_Latn">Nyanja</option>
                                        <option value="oci_Latn">Occitan</option>
                                        <option value="ory_Orya">Odia</option>
                                        <option value="pag_Latn">Pangasinan</option>
                                        <option value="pap_Latn">Papiamento</option>
                                        <option value="plt_Latn">Plateau Malagasy</option>
                                        <option value="pol_Latn">Polish</option>
                                        <option value="por_Latn">Portuguese</option>
                                        <option value="ron_Latn">Romanian</option>
                                        <option value="run_Latn">Rundi</option>
                                        <option value="rus_Cyrl">Russian</option>
                                        <option value="smo_Latn">Samoan</option>
                                        <option value="sag_Latn">Sango</option>
                                        <option value="san_Deva">Sanskrit</option>
                                        <option value="sat_Olck">Santali</option>

                                        <option value="shn_Mymr">Shan</option>

                                        <option value="scn_Latn">Sicilian</option>
                                        <option value="szl_Latn">Silesian</option>
                                        <option value="snd_Arab">Sindhi</option>
                                        <option value="sin_Sinh">Sinhala</option>
                                        <option value="slk_Latn">Slovak</option>
                                        <option value="slv_Latn">Slovenian</option>

                                        <option value="swh_Latn">Swahili</option>
                                        <option value="ssw_Latn">Swati</option>
                                        <option value="swe_Latn">Swedish</option>

                                        <option value="tgl_Latn">Tagalog</option>
                                        <option value="tgk_Cyrl">Tajik</option>
                                        <option value="taq_Latn">Tamasheq(Latin script)</option>

                                        <option value="tam_Taml">Tamil</option>

                                        <option value="tir_Ethi">Tigrinya</option>
                                        <option value="tpi_Latn">Tok Pisin</option>
                                        <option value="als_Latn">Tosk Albanian</option>
                                        <option value="tso_Latn">Tsonga</option>
                                        <option value="tsn_Latn">Tswana</option>
                                        <option value="tum_Latn">Tumbuka</option>
                                        <option value="aeb_Arab">Tunisian Arabic</option>
                                        <option value="tur_Latn">Turkish</option>
                                        <option value="tuk_Latn">Turkmen</option>
                                        <option value="twi_Latn">Twi</option>
                                        <option value="ukr_Cyrl">Ukrainian</option>
                                        <option value="umb_Latn">Umbundu</option>

                                        <option value="zul_Latn">Zulu</option>
                                    </select>
                                </div>
                                <div>
                                    <label for="model_translation" class="form-label">Translation model</label>
                                    <select id="model_translation" class="form-input">
                                        <option value="nllb-200-distilled-600M">NLLB 600M (faster)</option>
                                        <option value="nllb-200-distilled-1.3B">NLLB 1.3B (better)</option>
                                    </select>
                                </div>
                                <div class="col-span-2 flex gap-3">
                                    <div class="flex-1 min-w-0" data-icon="&#xE720;">
                                        <label for="microphone" class="form-label">Microphone</label>
                                        <select id="microphone" class="form-input">
                                            <option value="">Loading microphones...</option>
                                        </select>
                                    </div>
                                    <button type="button" id="refresh-microphones" class="btn btn-blue btn-square" title="Refresh microphone list">
                                        <i class="icon">&#xE72C;</i>
                                    </button>
                                </div>
                                <div data-icon="&#xE7C9;">
                                    <label for="button_hand" class="form-label">
                                        VR Hand
                                    </label>
                                    <select id="button_hand" class="form-input">
                                        <option value="left">Left</option>
                                        <option value="right">Right</option>
                                    </select>
                                </div>
                                <div data-icon="&#xE7FC;">
                                    <label for="button_type" class="form-label">
                                        VR Button
                                    </label>
                                    <select id="button_type" class="form-input">
                                        <option value="a">A</option>
                                        <option value="b">B</option>
                                        <option value="thumbstick">Thumbstick</option>
                                    </select>
                                </div>
                                <div class="col-span-2" data-icon="&#xE765;">
                                    <label for="keybind" class="form-label">
                                        Keyboard Binding
                                    </label>
                                    <input type="text" id="keybind" value="f24" class="form-input" placeholder="f24">
                                </div>
                            </div>
                        </section>

                        <!-- Advanced settings toggle -->
                        <button type="button" id="toggle-advanced" class="advanced-toggle flex items-center gap-2">
                            <svg id="chevron" class="w-5 h-5 transform transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                            </svg>
                            Advanced Settings
                        </button>

                        <!-- Advanced settings (initially hidden) -->
                        <div id="advanced-settings" class="hidden space-y-6">
                            <!-- Compute Settings -->
                            <section class="config-section">
                                <h2 class="section-title"><i class="icon">&#xE950;</i>Compute Settings</h2>
                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label for="compute_type" class="form-label">Compute Type</label>
                                        <select id="compute_type" class="form-input">
                                            <option value="int8">int8</option>
                                            <option value="float16">float16</option>
                                            <option value="float32">float32</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label for="gpu_idx" class="form-label">GPU Index</label>
                                        <input type="number" id="gpu_idx" min="0" value="0" class="form-input">
                                    </div>
                                    <div class="col-span-2">
                                        <label for="use_cpu" class="checkbox-label">
                                            <input type="checkbox" id="use_cpu" class="mr-2">
                                            <span class="checkbox-text">Use CPU</span>
                                        </label>
                                    </div>
                                </div>
                            </section>

                            <!-- Audio Settings -->
                            <section class="config-section">
                                <h2 class="section-title"><i class="icon">&#xE9D9;</i>Voice Activity Detection</h2>
                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label for="max_speech_duration_s" class="form-label">Max Speech Duration (seconds)</label>
                                        <input type="number" id="max_speech_duration_s" min="1" value="10" class="form-input">
                                    </div>
                                    <div>
                                        <label for="min_speech_duration_ms" class="form-label">Min Speech Duration (ms)</label>
                                        <input type="number" id="min_speech_duration_ms" min="0" value="100" class="form-input">
                                    </div>
                                    <div>
                                        <label for="min_silence_duration_ms" class="form-label">Min Silence Duration (ms)</label>
                                        <input type="number" id="min_silence_duration_ms" min="0" value="250" class="form-input">
                                    </div>
                                    <div>
                                        <label for="reset_after_silence_s" class="form-label">Reset After Silence (seconds)</label>
                                        <input type="number" id="reset_after_silence_s" min="1" value="15" class="form-input">
                                    </div>
                                </div>
                            </section>

                            <!-- Transcription Settings -->
                            <section class="config-section">
                                <h2 class="section-title"><i class="icon">&#xE8A5;</i>Transcription Settings</h2>
                                <div>
                                    <label for="user_prompt" class="form-label">
                                        Prompt
                                        <span class="text-gray-400text-xs block mt-1"
                                              title="Whisper is given this prompt before transcribing. It helps guide the transcription style. For example, you could improve the spelling of your friends' names with: 'My friends' names are Saoirse, Azariah, and Caoimhe.'">
                                            (Hover for details)
                                        </span>
                                    </label>
                                    <textarea id="user_prompt" 
                                              class="form-input h-20 resize-none" 
                                              placeholder="My friends' names are Saoirse, Azariah, and Caoimhe."></textarea>
                                </div>
                                <div class="grid grid-cols-2 gap-3 mt-4">
                                    <div>
                                        <label for="beam_size" class="form-label">
                                            Beam size
                                            <span class="text-gray-400text-xs block mt-1"
                                                  title="Number of beams for beam search. Higher values may improve accuracy but increase compute time.">
                                                (Search width)
                                            </span>
                                        </label>
                                        <input type="number" id="beam_size" min="1" max="20" value="5" class="form-input">
                                    </div>
                                    <div>
                                        <label for="best_of" class="form-label">
                                            Best of
                                            <span class="text-gray-400text-xs block mt-1"
                                                  title="Number of candidates to generate when sampling. The best one will be selected.">
                                                (Sampling candidates)
                                            </span>
                                        </label>
                                        <input type="number" id="best_of" min="1" max="20" value="5" class="form-input">
                                    </div>
                                </div>
                            </section>

                            <!-- Performance Settings -->
                            <section class="config-section">
                                <h2 class="section-title"><i class="icon">&#xEC4A;</i>Performance Settings</h2>
                                <div>
                                    <label for="transcription_loop_delay_ms" class="form-label">Transcription Loop Delay (ms)</label>
                                    <input type="number" id="transcription_loop_delay_ms" min="0" value="100" class="form-input">
                                </div>
                            </section>

                            <!-- Debug/Preview Settings -->
                            <section class="config-section">
                                <h2 class="section-title"><i class="icon">&#xEBE8;</i>Debug/Preview Settings</h2>
                                <div class="space-y-3">
                                    <label for="enable_debug_mode" class="checkbox-label">
                                        <input type="checkbox" id="enable_debug_mode" class="mr-2">
                                        <span class="checkbox-text">Enable Debug Mode</span>
                                    </label>
                                    <label for="enable_previews" class="checkbox-label">
                                        <input type="checkbox" id="enable_previews" checked class="mr-2">
                                        <span class="checkbox-text">Enable Previews</span>
                                    </label>
                                    <label for="save_audio" class="checkbox-label">
                                        <input type="checkbox" id="save_audio" class="mr-2">
                                        <span class="checkbox-text">Save Audio Segments</span>
                                    </label>
                                    <label for="enable_segment_logging" class="checkbox-label">
                                        <input type="checkbox" id="enable_segment_logging" class="mr-2">
                                        <span class="checkbox-text">Log Segment Metadata</span>
                                    </label>
                                </div>
                            </section>

                            <!-- Text Filters -->
                            <section class="config-section">
                                <h2 class="section-title"><i class="icon">&#xE71C;</i>Text Filters</h2>
                                <div class="space-y-3">
                                    <label for="enable_lowercase_filter" class="checkbox-label">
                                        <input type="checkbox" id="enable_lowercase_filter" class="mr-2">
                                        <span class="checkbox-text">Convert to lowercase</span>
                                    </label>
                                    <label for="enable_uppercase_filter" class="checkbox-label">
                                        <input type="checkbox" id="enable_uppercase_filter" class="mr-2">
                                        <span class="checkbox-text">Convert to uppercase</span>
                                    </label>
                                    <label for="enable_profanity_filter" class="checkbox-label">
                                        <input type="checkbox" id="enable_profanity_filter" class="mr-2">
                                        <span class="checkbox-text">Filter profanity</span>
                                    </label>
                                    <label for="remove_trailing_period" class="checkbox-label">
                                        <input type="checkbox" id="remove_trailing_period" class="mr-2">
                                        <span class="checkbox-text">Remove trailing period</span>
                                    </label>
                                    <label for="enable_orig_lang" class="checkbox-label">
                                        <input type="checkbox" id="enable_orig_lang" checked class="mr-2">
                                        <span class="checkbox-text">Show original text next to translation</span>
                                    </label>
                                </div>
                            </section>

                            <!-- Input Settings -->
                            <section class="config-section">
                                <h2 class="section-title"><i class="icon">&#xE765;</i>Input Settings</h2>
                                <div class="space-y-4">
                                    <label for="reset_on_toggle" class="checkbox-label">
                                        <input type="checkbox" id="reset_on_toggle" class="mr-2">
                                        <span class="checkbox-text">Reset transcript on toggle</span>
                                    </label>
                                    <div>
                                        <label for="volume" class="form-label">
                                            Local Beep Volume
                                            <span id="volume-display" class="text-gray-400text-sm ml-2">30%</span>
                                        </label>
                                        <input type="range" id="volume" min="0" max="100" step="10" value="30" class="form-input w-full">
                                    </div>
                                </div>
                            </section>

                            <!-- Display Settings -->
                            <section class="config-section">
                                <h2 class="section-title"><i class="icon">&#xE8BD;</i>Custom Chatbox Settings</h2>
                                <div class="mb-4">
                                    <label for="use_builtin" class="checkbox-label">
                                        <input type="checkbox" id="use_builtin" class="mr-2">
                                        <span class="checkbox-text">Use built-in VRChat chatbox</span>
                                    </label>
                                </div>
                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label for="block_width" class="form-label">Block Width</label>
                                        <input type="number" id="block_width" min="1" value="2" class="form-input">
                                    </div>
                                    <div>
                                        <label for="num_blocks" class="form-label">Number of Blocks</label>
                                        <input type="number" id="num_blocks" min="1" value="40" class="form-input">
                                    </div>
                                    <div>
                                        <label for="rows" class="form-label">Rows</label>
                                        <input type="number" id="rows" min="1" value="10" class="form-input">
                                    </div>
                                    <div>
                                        <label for="cols" class="form-label">Columns</label>
                                        <input type="number" id="cols" min="1" value="24" class="form-input">
                                    </div>
                                </div>
                            </section>

                            <!-- Configuration Settings -->
                            <section class="config-section">
                                <h2 class="section-title"><i class="icon">&#xE713;</i>Configuration</h2>
                                <div>
                                    <button type="button" id="reset-config" class="btn btn-blue w-full">
                                        Reset Config to Defaults
                                    </button>
                                </div>
                            </section>

                            <!-- Virtual Environment Settings -->
                            <section class="config-section">
                                <h2 class="section-title"><i class="icon">&#xE943;</i>Virtual Environment</h2>
                                <div class="flex space-x-3">
                                    <button type="button" id="setup-venv" class="btn btn-blue flex-1">
                                        Setup venv
                                    </button>
                                    <button type="button" id="reset-venv" class="btn btn-blue flex-1">
                                        Reset venv
                                    </button>
                                </div>
                            </section>
                        </div>

                        <!-- Action Buttons -->
                        <div class="pb-6">
                            <div class="flex space-x-3">
                                <button type="button" id="start-process" class="btn btn-green btn-tile flex-1">
                                    Start
                                </button>
                                <button type="button" id="stop-process" class="btn btn-red btn-tile flex-1">
                                    Stop
                                </button>
                            </div>
                        </div>
                    </form>
                    
                    <!-- Status Message -->
                    <div id="status-message" class="mt-6 p-4 hidden"></div>
                </div>
            </div>

            <!-- Right Panel: Python Console -->
            <div class="console-window flex-1 flex flex-col overflow-hidden">
                <h2 class="console-titlebar"><i class="console-icon icon">&#xE756;</i>console</h2>
                <div id="python-console" class="flex-1 overflow-y-auto p-4 font-mono text-sm">
                    <div id="console-content" class="whitespace-pre-wrap"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="config-schema.js"></script>
    <script src="renderer.js"></script>
</body>
</html>
